aid: happymoney
name: Happy Money
description: 'Happy Money is a consumer finance company offering fully digital unsecured
  personal loans, best known for The Payoff Loan, aimed at helping members consolidate
  and pay off high-interest credit card debt. Loans are funded through a network of
  community-focused credit unions, banks, and asset managers rather than by Happy Money
  itself. The company has served over 350,000 customers and facilitated more than $7
  billion in personal loans, and operates the industry''s first end-to-end API for
  unsecured lending, offered to lending partners through a gated partner portal rather
  than as a public self-serve developer product. This API Evangelist profile was seeded
  as a portfolio-company lead (Anthemis) and enriched from Happy Money''s public web
  presence; its lending API surface is partner-gated and not publicly documented.'
